name: GPU compile-only builds

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cuda:
    name: CUDA compile-only
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.3.0-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake gfortran make libopenblas-dev liblapack-dev libfftw3-dev
      - name: Configure
        # The runner has no visible GPU, so the preset's CMAKE_CUDA_ARCHITECTURES=native
        # default cannot resolve; pin an architecture explicitly.
        run: >-
          cmake --preset cuda
          -DCMAKE_CUDA_ARCHITECTURES=80 -DBUILD_TESTING=OFF -DRUN_ASD_TESTS=OFF
          -DRUN_REG_TESTS=OFF -DRUN_CUDA_TESTS=OFF
      - name: Build
        run: cmake --build --preset cuda --parallel 1

  hip:
    name: HIP compile-only
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-24.04:latest
    env:
      ROCM_PATH: /opt/rocm
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake gfortran make libopenblas-dev liblapack-dev libfftw3-dev
      - name: Configure
        # One architecture only: the preset targets gfx90a;gfx942, and a
        # compile-only runner gains nothing from building both.
        run: >-
          cmake --preset hip-cdna
          -DCMAKE_HIP_ARCHITECTURES=gfx90a -DBUILD_TESTING=OFF -DRUN_ASD_TESTS=OFF
          -DRUN_REG_TESTS=OFF
      - name: Build
        run: cmake --build --preset hip-cdna --parallel 1
