schema_version: "1.0.0"
id: B01_bccFe
description: >
  bcc Fe, medium-range exchange interaction cloud (blueprint B01) -- the
  canonical three-dimensional ASD production benchmark, primary OpenMP
  scaling reference and primary CPU/GPU crossover reference. Input template
  is the maintainer-supplied production deck
  examples/SimpleSystems/bccFeCPU (copied verbatim; see README.md in this
  directory for the full audit).
template_directory: template
workload_class: medium_range_neighbor
dimensionality: "3D"
scalable_dimensions: ["Nx", "Ny", "Nz"]
expected_physics:
  lattice: >
    bcc, conventional two-atom cubic-cell basis (posfile: (0,0,0) and
    (0.5,0.5,0.5)), cubic symmetry (Sym=1), reduced lattice parameter a=1.0,
    fully periodic (BC P P P).
  hamiltonian_terms: ["exchange", "anisotropy"]
  notes: >
    Exchange: 8 shells out to a cutoff radius of 2.0 (reduced units),
    symmetry-expanded by Sym=1 to a bulk coordination number of 58
    directed neighbours per atom (both basis atoms couple identically --
    jfile declares only type pair "1 1"). Anisotropy: combined
    uniaxial+cubic (anisotropytype=7, source/Hamiltonian/energy.f90) on
    both basis atoms, K1=-0.02, K2=0.0, easy axis (0,1,0), cubic-term
    weight (ratio_k) 0.1 -- active because inpsd.dat's `anisotropy`
    keyword sets do_anisotropy=1 (source/Input/inputhandler.f90). No
    external field (hfield 0 0 0) and no dipole/FFT term (no dipole
    keyword present). Integrator: Depondt (SDEalgh 5), damping 0.5,
    timestep 1.0e-17 s. Mensemble 10 (ten independent ensembles per run,
    fixed by the template, not overridable). ip_mode N: 'N' matches none
    of the initial-phase branches in source/uppasd.f90::run_initial_phase,
    so no initial phase executes despite the ip_mcanneal block being
    present in the file -- that block is dead input for this template.
    Maintainer-supplied production temperature: 100 K (the template's own
    baseline `Temp` value; used verbatim by the bcc_fe_finite_t variant,
    never invented).
variants:
  - id: bcc_fe_t0
    description: >
      Zero-temperature relaxation dynamics. Deterministic: the required
      reference for CPU-vs-GPU physical-consistency sanity checks
      (harness.gpu_sanity requires temperature==0).
    overrides:
      temp: 0.0
      tseed: 1
  - id: bcc_fe_finite_t
    description: >
      Finite-temperature Langevin dynamics at the maintainer-supplied
      production temperature (100 K, the template's own baseline --
      not an invented "representative" value).
    overrides:
      temp: 100.0
      tseed: 2
sizes:
  # Nx=Ny=Nz=n, natom = 2*n^3 (two-atom basis). Isotropic bulk cubes
  # targeting the ~4x ladder 4k/16k/64k/256k/1M/4M atoms; n is the closest
  # legal integer replication to each target -- geometry is never distorted
  # to force an exact atom count (blueprint B01/WP-08A). 32x32x32 (65536
  # atoms) is this project's established historical reference size (see
  # docs/CGP-07_ARCHITECTURE_REBASELINE_EVIDENCE.md and
  # tests/gpu_regression/bench.py's "bcc_medium" case) and lands on this
  # ladder's 64k tier exactly.
  - id: 13x13x13   # natom=4394   (target 4096,   +7.3%)
    replication: [13, 13, 13]
  - id: 20x20x20   # natom=16000  (target 16384,  -2.3%)
    replication: [20, 20, 20]
  - id: 32x32x32   # natom=65536  (target 65536,  exact -- historical reference size)
    replication: [32, 32, 32]
  - id: 40x40x40   # natom=128000 -- WP-10 intermediate tier, added (not part of the original
                    # ~4x ladder) so the first authoritative campaign's "large" size can sit at
                    # roughly half of 51x51x51's fixed-cost budget (fixed/setup cost was measured
                    # to scale ~linearly with natom, ~0.2ms/atom) rather than the full 265302-atom
                    # point, per docs/BENCHMARK_PRODUCTION_CHARACTERIZATION_2026-08-28.md.
    replication: [40, 40, 40]
  - id: 51x51x51   # natom=265302 (target 262144, +1.2%)
    replication: [51, 51, 51]
  - id: 81x81x81   # natom=1062882 (target 1048576, +1.4%)
    replication: [81, 81, 81]
  - id: 128x128x128 # natom=4194304 (target 4194304, exact)
    replication: [128, 128, 128]
allowed_input_overrides:
  - ncell
  - Nstep
  - tseed
  - temp
  - do_prnstruct
  - avrg_step
  - cumu_step
  - tottraj_step
  - ene_step
  - gpu_mode
workload_metadata_method: neighbor_list_from_struct_output
